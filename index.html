<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schiffe Versenken - Multiplayer</title>
    <!-- PeerJS für die Online-Verbindung zwischen Handys -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            
            /* FARBEN: Maximaler Kontrast */
            --water-bg: #030712;         /* Tiefes Schwarz-Blau für Meer */
            --water-border: #1e3a8a;     /* Blaue Gitterlinien */
            --ship-color: #facc15;       /* KNALLIGES GELB/GOLD FÜR SCHIFFE */
            --ship-border: #ffffff;      /* Weißer Rand um die Schiffe */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-align: center;
            color: var(--primary);
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        button:active {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #475569;
        }

        button.accent {
            background-color: var(--accent);
        }

        .status-box {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        /* Spielfelder Grid */
        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }

        .board-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
        }

        .board-title {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: 25px repeat(10, 1fr);
            grid-template-rows: 25px repeat(10, 1fr);
            gap: 2px;
            background: var(--water-border);
            padding: 2px;
            border-radius: 4px;
            max-width: 320px;
            margin: 0 auto;
        }

        .cell {
            background-color: var(--water-bg);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            cursor: pointer;
            border-radius: 2px;
            user-select: none;
        }

        .header-cell {
            background-color: transparent !important;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: bold;
            cursor: default !important;
        }

        /* SCHIFFE: Knalliges Gelb mit weißem Rand */
        .ship {
            background-color: var(--ship-color) !important;
            border: 2px solid var(--ship-border) !important;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
        }

        .hit {
            background-color: var(--danger) !important;
            color: white;
            font-weight: bold;
        }

        .miss {
            background-color: #334155 !important;
            color: var(--text-muted);
        }

        .log {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.85rem;
            height: 70px;
            overflow-y: auto;
            width: 100%;
            max-width: 450px;
            margin-top: 15px;
            text-align: left;
            color: var(--text-muted);
        }

        .fleet-setup-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            max-width: 450px;
        }

        .fleet-info {
            font-size: 0.9rem;
            color: #facc15;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>Schiffe Versenken</h1>

    <!-- ANSICHT 1: Menü -->
    <div id="menu-screen" class="card">
        <p style="margin-bottom: 15px; color: var(--text-muted);">Gib einen 4-stelligen Raumcode ein (z.B. 1234), um ein Spiel zu starten oder beizutreten.</p>
        <input type="text" id="room-code-input" maxlength="6" placeholder="z.B. 4711">
        <button id="create-btn" class="accent">Raum erstellen</button>
        <button id="join-btn" class="secondary">Raum beitreten</button>
        <div id="menu-status" class="status-box hidden" style="color: var(--danger); margin-top: 10px;"></div>
    </div>

    <!-- ANSICHT 2: Schiff-Platzierung -->
    <div id="setup-screen" class="card hidden">
        <h2>Flotte positionieren</h2>
        <div id="ship-status-text" class="fleet-info">Tippe auf das Feld um Schiffe zu setzen</div>
        
        <div class="board-wrapper" style="margin-top: 10px;">
            <div class="board-title">Dein Hafen (Gelb = Schiff)</div>
            <div id="setup-grid" class="grid"></div>
        </div>

        <div class="fleet-setup-bar">
            <button id="rotate-btn" class="secondary" style="margin:0; font-size:0.8rem; padding:8px;">Horiz.</button>
            <button id="clear-btn" class="secondary" style="margin:0; font-size:0.8rem; padding:8px; background:#ef4444;">Löschen</button>
            <button id="random-btn" style="margin:0; font-size:0.8rem; padding:8px;">Zufall</button>
        </div>

        <button id="start-game-btn" class="accent hidden" style="margin-top: 15px;">Bereit &amp; Starten</button>
    </div>

    <!-- ANSICHT 3: Aktives Spiel -->
    <div id="game-screen" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div id="turn-indicator" class="card" style="padding: 10px; margin-bottom: 10px; font-weight: bold; font-size: 1rem;">
            Warte auf Mitspieler...
        </div>

        <div class="board-container">
            <div class="board-wrapper">
                <div class="board-title">Gegnerisches Gewässer</div>
                <div id="enemy-grid" class="grid"></div>
            </div>
            
            <div class="board-wrapper">
                <div class="board-title">Deine Flotte (Gelb)</div>
                <div id="player-grid" class="grid"></div>
            </div>
        </div>

        <div id="game-log" class="log">Spiel gestartet. Viel Erfolg!</div>
    </div>

    <script>
        const letters = ['A','B','C','D','E','F','G','H','I','J'];
        let peer = null, conn = null;
        let isHost = false;

        const shipSizes = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
        let currentShipIndex = 0;
        let horizontal = true;
        let playerBoard = Array(10).fill(null).map(() => Array(10).fill(0));
        let enemyShots = Array(10).fill(null).map(() => Array(10).fill(0)); 
        let myShots = Array(10).fill(null).map(() => Array(10).fill(0));    
        let myTurn = false;
        let gameActive = false;
        let opponentReady = false;
        let iAmReady = false;

        const ui = {
            menu: document.getElementById('menu-screen'),
            setup: document.getElementById('setup-screen'),
            game: document.getElementById('game-screen'),
            roomInput: document.getElementById('room-code-input'),
            createBtn: document.getElementById('create-btn'),
            joinBtn: document.getElementById('join-btn'),
            menuStatus: document.getElementById('menu-status'),
            setupGrid: document.getElementById('setup-grid'),
            playerGrid: document.getElementById('player-grid'),
            enemyGrid: document.getElementById('enemy-grid'),
            rotateBtn: document.getElementById('rotate-btn'),
            randomBtn: document.getElementById('random-btn'),
            clearBtn: document.getElementById('clear-btn'),
            startBtn: document.getElementById('start-game-btn'),
            turnIndicator: document.getElementById('turn-indicator'),
            gameLog: document.getElementById('game-log'),
            shipStatusText: document.getElementById('ship-status-text')
        };

        function showStatus(text) {
            ui.menuStatus.textContent = text;
            ui.menuStatus.classList.remove('hidden');
        }

        function createGridElements(container, isEnemy) {
            container.innerHTML = '';
            const corner = document.createElement('div');
            corner.className = 'cell header-cell';
            container.appendChild(corner);

            for(let c=1; c<=10; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell header-cell';
                cell.textContent = c;
                container.appendChild(cell);
            }

            for(let r=0; r<10; r++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'cell header-cell';
                rowHeader.textContent = letters[r];
                container.appendChild(rowHeader);

                for(let c=0; c<10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    if(isEnemy) {
                        cell.addEventListener('click', () => handleEnemyGridClick(r, c));
                    } else {
                        cell.addEventListener('click', () => handleSetupGridClick(r, c));
                    }
                    container.appendChild(cell);
                }
            }
        }

        function clearSetup() {
            playerBoard = Array(10).fill(null).map(() => Array(10).fill(0));
            currentShipIndex = 0;
            iAmReady = false;
            ui.startBtn.classList.add('hidden');
            ui.startBtn.disabled = false;
            ui.startBtn.textContent = "Bereit & Starten";
            updateShipStatusText();
            drawSetupBoard();
        }

        function updateShipStatusText() {
            if(currentShipIndex < shipSizes.length) {
                ui.shipStatusText.textContent = `Setze Schiff: ${shipSizes[currentShipIndex]}er Feld(er) (${currentShipIndex+1}/${shipSizes.length})`;
            } else {
                ui.shipStatusText.textContent = "Alle Schiffe platziert!";
            }
        }

        function drawSetupBoard() {
            const cells = ui.setupGrid.children;
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    const idx = 11 + r * 11 + c;
                    const cell = cells[idx];
                    if(cell) {
                        cell.className = 'cell';
                        if(playerBoard[r][c] === 1) {
                            cell.classList.add('ship');
                        }
                    }
                }
            }
        }

        function placeShipsRandomly() {
            playerBoard = Array(10).fill(null).map(() => Array(10).fill(0));
            for(let size of shipSizes) {
                let placed = false;
                let attempts = 0;
                while(!placed && attempts < 100) {
                    attempts++;
                    let h = Math.random() < 0.5;
                    let r = Math.floor(Math.random() * 10);
                    let c = Math.floor(Math.random() * 10);
                    if(canPlaceShip(playerBoard, r, c, size, h)) {
                        setShip(playerBoard, r, c, size, h);
                        placed = true;
                    }
                }
            }
            currentShipIndex = shipSizes.length;
            updateShipStatusText();
            drawSetupBoard();
            ui.startBtn.classList.remove('hidden');
        }

        function canPlaceShip(board, r, c, size, h) {
            if(h && c + size > 10) return false;
            if(!h && r + size > 10) return false;

            for(let i=0; i<size; i++) {
                let nr = h ? r : r + i;
                let nc = h ? c + i : c;
                if(board[nr][nc] === 1) return false;
                for(let dr=-1; dr<=1; dr++) {
                    for(let dc=-1; dc<=1; dc++) {
                        let ar = nr + dr, ac = nc + dc;
                        if(ar >= 0 && ar < 10 && ac >= 0 && ac < 10) {
                            if(board[ar][ac] === 1) return false;
                        }
                    }
                }
            }
            return true;
        }

        function setShip(board, r, c, size, h) {
            for(let i=0; i<size; i++) {
                let nr = h ? r : r + i;
                let nc = h ? c + i : c;
                board[nr][nc] = 1;
            }
        }

        function handleSetupGridClick(r, c) {
            if(iAmReady) return;
            
            // Wenn alle Schiffe platziert sind, setzt ein Klick die Auswahl zurück
            if(currentShipIndex >= shipSizes.length) {
                clearSetup();
                return;
            }

            let size = shipSizes[currentShipIndex];
            if(canPlaceShip(playerBoard, r, c, size, horizontal)) {
                setShip(playerBoard, r, c, size, horizontal);
                currentShipIndex++;
                updateShipStatusText();
                drawSetupBoard();
                if(currentShipIndex >= shipSizes.length) {
                    ui.startBtn.classList.remove('hidden');
                }
            }
        }

        ui.rotateBtn.addEventListener('click', () => {
            horizontal = !horizontal;
            ui.rotateBtn.textContent = horizontal ? 'Horiz.' : 'Vertik.';
        });

        ui.randomBtn.addEventListener('click', placeShipsRandomly);
        ui.clearBtn.addEventListener('click', clearSetup);

        ui.startBtn.addEventListener('click', () => {
            iAmReady = true;
            ui.startBtn.textContent = "Warte auf Gegner...";
            ui.startBtn.disabled = true;
            checkReadyState();
        });

        function getPeerId(roomCode) {
            return "sschiff_" + roomCode.trim().toLowerCase();
        }

        ui.createBtn.addEventListener('click', () => {
            const code = ui.roomInput.value.trim();
            if(code.length < 2) {
                showStatus("Bitte mind. 2 Zeichen eingeben!");
                return;
            }
            showStatus("Erstelle Raum...");
            isHost = true;
            
            if(peer) peer.destroy();
            peer = new Peer(getPeerId(code));

            peer.on('open', () => {
                showStatus("Raum bereit! Warte auf Mitspieler...");
                ui.createBtn.disabled = true;
                ui.joinBtn.disabled = true;
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnection();
                showStatus("Mitspieler verbunden!");
                switchToSetup();
            });

            peer.on('error', (err) => {
                showStatus("Fehler: Raum existiert bereits oder Netzwerkfehler.");
            });
        });

        ui.joinBtn.addEventListener('click', () => {
            const code = ui.roomInput.value.trim();
            if(code.length < 2) {
                showStatus("Bitte Raumcode eingeben!");
                return;
            }
            showStatus("Verbinde mit Raum...");
            isHost = false;

            if(peer) peer.destroy();
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(getPeerId(code));
                setupConnection();
            });

            peer.on('error', (err) => {
                showStatus("Raum nicht gefunden oder Fehler.");
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                if(!isHost) {
                    switchToSetup();
                }
            });

            conn.on('data', (data) => {
                handleNetworkData(data);
            });

            conn.on('close', () => {
                alert("Verbindung zum Mitspieler verloren!");
                location.reload();
            });
        }

        function switchToSetup() {
            ui.menu.classList.add('hidden');
            ui.setup.classList.remove('hidden');
            createGridElements(ui.setupGrid, false);
            clearSetup();
            placeShipsRandomly(); // Vorab einmal zufällig als Vorschlag setzen
        }

        function checkReadyState() {
            conn.send({ type: 'READY' });
            if(opponentReady) {
                startGame();
            }
        }

        function handleNetworkData(data) {
            if(data.type === 'READY') {
                opponentReady = true;
                if(iAmReady) {
                    startGame();
                } else {
                    logMessage("Gegner ist bereit!");
                }
            } else if(data.type === 'SHOT') {
                receiveShot(data.r, data.c);
            } else if(data.type === 'SHOT_RESULT') {
                handleShotResult(data.r, data.c, data.hit, data.gameOver);
            }
        }

        function startGame() {
            ui.setup.classList.add('hidden');
            ui.game.classList.remove('hidden');
            createGridElements(ui.playerGrid, false);
            createGridElements(ui.enemyGrid, true);
            drawPlayerBoardInGame();

            gameActive = true;
            myTurn = isHost;
            updateTurnIndicator();
            logMessage("Spiel gestartet! " + (myTurn ? "Du beginnst." : "Gegner beginnt."));
        }

        function drawPlayerBoardInGame() {
            const cells = ui.playerGrid.children;
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    const idx = 11 + r * 11 + c;
                    const cell = cells[idx];
                    cell.className = 'cell';
                    if(playerBoard[r][c] === 1) cell.classList.add('ship');
                    if(enemyShots[r][c] === 2) cell.classList.add('hit');
                    if(enemyShots[r][c] === 1) cell.classList.add('miss');
                }
            }
        }

        function drawEnemyBoardInGame() {
            const cells = ui.enemyGrid.children;
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    const idx = 11 + r * 11 + c;
                    const cell = cells[idx];
                    cell.className = 'cell';
                    if(myShots[r][c] === 2) cell.classList.add('hit');
                    if(myShots[r][c] === 1) cell.classList.add('miss');
                }
            }
        }

        function handleEnemyGridClick(r, c) {
            if(!gameActive || !myTurn) return;
            if(myShots[r][c] !== 0) return;

            conn.send({ type: 'SHOT', r: r, c: c });
            myTurn = false;
            updateTurnIndicator();
        }

        function receiveShot(r, c) {
            let hit = false;
            if(playerBoard[r][c] === 1) {
                playerBoard[r][c] = 2;
                enemyShots[r][c] = 2;
                hit = true;
            } else {
                enemyShots[r][c] = 1;
            }
            drawPlayerBoardInGame();

            let gameOver = checkGameOver(playerBoard);
            conn.send({ type: 'SHOT_RESULT', r: r, c: c, hit: hit, gameOver: gameOver });

            if(gameOver) {
                gameActive = false;
                ui.turnIndicator.textContent = "Niederlage! Alle deine Schiffe wurden versenkt.";
                ui.turnIndicator.style.color = "var(--danger)";
                logMessage("Du hast verloren!");
            } else {
                myTurn = true;
                updateTurnIndicator();
                logMessage(`Gegner schoss auf ${letters[r]}${c+1}: ${hit ? 'Treffer!' : 'Vorbei.'}`);
            }
        }

        function handleShotResult(r, c, hit, gameOver) {
            myShots[r][c] = hit ? 2 : 1;
            drawEnemyBoardInGame();

            if(gameOver) {
                gameActive = false;
                ui.turnIndicator.textContent = "Sieg! Du hast alle gegnerischen Schiffe versenkt!";
                ui.turnIndicator.style.color = "var(--accent)";
                logMessage("Du hast gewonnen!");
            } else {
                if(!hit) {
                    myTurn = false;
                    updateTurnIndicator();
                } else {
                    myTurn = true;
                    updateTurnIndicator();
                }
                logMessage(`Dein Schuss auf ${letters[r]}${c+1}: ${hit ? 'Treffer! Du darfst nochmal.' : 'Vorbei.'}`);
            }
        }

        function checkGameOver(board) {
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    if(board[r][c] === 1) return false;
                }
            }
            return true;
        }

        function updateTurnIndicator() {
            if(!gameActive) return;
            if(myTurn) {
                ui.turnIndicator.textContent = "Du bist am Zug! Wähle ein Feld beim Gegner.";
                ui.turnIndicator.style.color = "var(--accent)";
            } else {
                ui.turnIndicator.textContent = "Gegner ist am Zug...";
                ui.turnIndicator.style.color = "var(--text-muted)";
            }
        }

        function logMessage(msg) {
            ui.gameLog.innerHTML += `<div>> ${msg}</div>`;
            ui.gameLog.scrollTop = ui.gameLog.scrollHeight;
        }
    </script>
</body>
</html>
